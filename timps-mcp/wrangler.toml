name = "timps-mcp"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables
[vars]
TIMPS_MEMORY_URL = "https://enlargement-pump-machine-acceptance.trycloudflare.com"
TIMPS_PROJECT_PATH = "."

# TIMPS_API_KEY is a SECRET and must never be committed here.
# Set it on the Worker instead:
#   wrangler secret put TIMPS_API_KEY
# For local dev, put it in an untracked .dev.vars file.
