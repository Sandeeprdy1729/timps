name: Dependency Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * *'  # Daily

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for vulnerable dependencies
        continue-on-error: true
        run: npm audit --audit-level=critical

      - name: Update dependencies
        if: github.event_name == 'schedule'
        run: npx npm-check-updates -u

      - name: Check for changes
        if: github.event_name == 'schedule'
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch, commit and push
        if: github.event_name == 'schedule' && steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="deps/update-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add package.json packages/*/package.json timps-code/package.json timps-mcp/package.json
          git commit -m "chore(deps): update dependencies $(date +%Y-%m-%d)"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_ENV"

      - name: Create pull request
        if: github.event_name == 'schedule' && steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.branch;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
            });
            if (prs.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'chore(deps): Update dependencies',
                head: branch,
                base: context.repo.default_branch,
                body: 'Automated dependency updates generated by `npm-check-updates`.',
              });
            }
