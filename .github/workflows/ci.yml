name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  workspace-smoke:
    name: workspace smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Linux Rollup optional binary
        run: npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Build SDK packages
        run: |
          npm run build --workspace=packages/plugin-sdk
          npm run build --workspace=packages/sdk

      - name: Run SDK package tests
        run: |
          npm run test --workspace=packages/plugin-sdk
          npx vitest run packages/sdk/src/sdk.test.ts

      - name: Run enterprise tests
        run: npm run test --workspace=packages/timps-enterprise
