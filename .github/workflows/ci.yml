name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timps-vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: timps-vscode/package-lock.json

      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npx vsce package -o timps-vscode.vsix

  workspace-smoke:
    name: workspace smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Linux Rollup optional binary
        run: npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Build SDK packages
        run: |
          npm run build --workspace=packages/memory-core
          npm run build --workspace=packages/plugin-sdk
          npm run build --workspace=packages/sdk

      - name: Verify release build
        run: npm run release:build

      - name: Run SDK package tests
        run: |
          npm run test --workspace=packages/plugin-sdk
          npx vitest run packages/sdk/src/sdk.test.ts

      - name: Run enterprise tests
        run: npm run test --workspace=packages/timps-enterprise
