name: Supply Chain Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Weekly Monday 09:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: npm audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "."
          - "timps-code"
          - "timps-mcp"
          - "timps-vscode"
          - "packages/server"
          - "packages/memory-core"
          - "packages/plugin-sdk"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high --audit-level=critical

  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run OSV Scanner
        uses: google/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./
