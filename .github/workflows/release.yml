name: Release

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "package.json"
      - "timps-code/package.json"
      - "timps-mcp/package.json"
      - "timps-vscode/package.json"
      - "packages/server/package.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check for changesets
        id: has_changesets
        run: |
          if compgen -G ".changeset/*.md" > /dev/null; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Create Release PR or publish changed packages ──────────────────────
      - name: Create Release PR or Publish
        if: steps.has_changesets.outputs.has_changesets == 'true'
        id: changesets
        uses: changesets/action@v2
        with:
          publish: npx changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── timps-code: publish if changed ─────────────────────────────────────
      - name: Publish timps-code
        if: steps.changesets.outputs.published == 'true'
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not configured — skipping publish"
            exit 0
          fi
          cd timps-code
          npm ci
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── timps-mcp: publish if changed ──────────────────────────────────────
      - name: Publish timps-mcp
        if: steps.changesets.outputs.published == 'true'
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not configured — skipping publish"
            exit 0
          fi
          cd timps-mcp
          npm ci
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── GitHub Release notes ────────────────────────────────────────────────
      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No release changesets found
        if: steps.has_changesets.outputs.has_changesets != 'true'
        run: echo "No changesets found; skipping release."
