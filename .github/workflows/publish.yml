name: Publish to npm

on:
  push:
    tags:
      - 'v*'             # publishes timps (server)      e.g. v2.0.3
      - 'code-v*'        # publishes timps-code (CLI)    e.g. code-v2.0.1
      - 'mcp-v*'         # publishes timps-mcp           e.g. mcp-v1.0.1

jobs:
  # ── timps (server) ──────────────────────────────────────────────────────────
  publish-timps:
    name: Publish timps (server)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=packages/server

      - name: Verify build
        run: test -f packages/server/dist/main.js

      - name: Publish to npm
        run: npm publish --access public --workspace=packages/server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## TIMPS ${{ github.ref_name }}

            Install or update:
            ```bash
            npm install -g @timps/server
            ```

            See the [full changelog](https://github.com/Sandeeprdy1729/timps/releases) for what's new.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── timps-code (CLI) ────────────────────────────────────────────────────────
  publish-timps-code:
    name: Publish timps-code (CLI)
    if: startsWith(github.ref, 'refs/tags/code-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=timps-code

      - name: Verify build
        run: test -f timps-code/dist/bin/timps.js

      - name: Publish to npm
        run: npm publish --access public --workspace=timps-code
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: timps-code ${{ github.ref_name }}
          body: |
            ## timps-code ${{ github.ref_name }}

            Install or update:
            ```bash
            npm install -g @timps-ai/timps-code
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── timps-mcp ───────────────────────────────────────────────────────────────
  publish-timps-mcp:
    name: Publish timps-mcp
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=timps-mcp

      - name: Verify build
        run: test -f timps-mcp/dist/index.js

      - name: Publish to npm
        run: npm publish --access public --workspace=timps-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: timps-mcp ${{ github.ref_name }}
          body: |
            ## timps-mcp ${{ github.ref_name }}

            Install or update:
            ```bash
            npm install -g @timps-ai/timps-mcp
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
