name: Test & Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: plugin-sdk
            command: npm run test --workspace=packages/plugin-sdk
            coverage_files: packages/plugin-sdk/src/__tests__/echo.test.ts packages/plugin-sdk/src/__tests__/registry.test.ts
          - target: sdk
            command: npx vitest run packages/sdk/src/sdk.test.ts
            coverage_files: packages/sdk/src/sdk.test.ts
          - target: timps-enterprise
            command: npm run test --workspace=packages/timps-enterprise
            coverage_files: packages/timps-enterprise/test/auth.test.ts packages/timps-enterprise/test/teamMemory.test.ts packages/timps-enterprise/test/server.test.ts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Linux Rollup optional binary
        run: npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Run tests
        run: ${{ matrix.command }}

      - name: Generate coverage report
        run: |
          npx vitest run \
            --coverage \
            --coverage.thresholds.lines=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 \
            --coverage.thresholds.statements=0 \
            --coverage.reportsDirectory=coverage/${{ matrix.target }} \
            ${{ matrix.coverage_files }}

      - name: Upload coverage
        if: hashFiles('coverage/${{ matrix.target }}/coverage-final.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.target }}
          path: coverage/${{ matrix.target }}/coverage-final.json

  coverage-gate:
    name: coverage artifact gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage

      - name: Ensure coverage reports were generated
        run: |
          COUNT=$(find coverage -name "coverage-final.json" | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 1 ]; then
            echo "No coverage-final.json artifacts were generated"
            exit 1
          fi
          echo "Found $COUNT coverage artifact(s)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx
        continue-on-error: true

  benchmark:
    if: hashFiles('packages/memory-core/src/MemoryEngine.ts') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks
        run: npx tsx benchmark/index.ts --quick

      - name: Upload benchmark results
        if: hashFiles('.timps/benchmarks/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: .timps/benchmarks/*.json
