name: Test & Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: plugin-sdk
            command: npm run test --workspace=packages/plugin-sdk
          - target: sdk
            command: npx vitest run packages/sdk/src/sdk.test.ts
          - target: timps-enterprise
            command: npm run test --workspace=packages/timps-enterprise
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Linux Rollup optional binary
        run: npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Run tests
        run: ${{ matrix.command }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx
        continue-on-error: true

  benchmark:
    if: hashFiles('packages/memory-core/src/MemoryEngine.ts') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks
        run: npx tsx benchmark/index.ts --quick

      - name: Upload benchmark results
        if: hashFiles('.timps/benchmarks/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: .timps/benchmarks/*.json
