name: Test & Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - memory-core
          - plugin-sdk
          - sdk
          - timps-desktop
          - timps-enterprise
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        working-directory: packages/${{ matrix.package }}
        run: npx vitest run --coverage

      - name: Upload coverage
        if: hashFiles('packages/${{ matrix.package }}/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/coverage-summary.json

  coverage-gate:
    name: coverage gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage

      - name: Enforce 60% coverage thresholds
        run: |
          FAIL=false
          for f in coverage/coverage-*.json; do
            [ -f "$f" ] || continue
            pkg=$(basename "$f" .json | sed 's/coverage-//')
            LINES=$(jq '.total.lines.pct // 0' "$f")
            FUNCS=$(jq '.total.functions.pct // 0' "$f")
            BRANCHES=$(jq '.total.branches.pct // 0' "$f")
            echo "$pkg — Lines: ${LINES}% | Functions: ${FUNCS}% | Branches: ${BRANCHES}%"
            if (( $(echo "$LINES < 60" | bc -l) )); then echo "  ❌ $pkg lines below 60%"; FAIL=true; fi
            if (( $(echo "$FUNCS < 60" | bc -l) )); then echo "  ❌ $pkg functions below 60%"; FAIL=true; fi
            if (( $(echo "$BRANCHES < 60" | bc -l) )); then echo "  ❌ $pkg branches below 60%"; FAIL=true; fi
          done
          if [ "$FAIL" = true ]; then exit 1; fi
          echo "✅ All packages meet 60% coverage thresholds"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx
        continue-on-error: true

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks
        run: npx tsx benchmark/index.ts --quick

      - name: Upload benchmark results
        if: hashFiles('.timps/benchmarks/*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: .timps/benchmarks/*.json
