global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape all memory-server replicas individually via DNS service discovery.
  # With --scale memory=3, 'memory' resolves to all container IPs, giving
  # each replica its own metric series (no round-robin interleaving).
  - job_name: 'memory-server'
    dns_sd_configs:
      - names:
          - 'memory'
        type: 'A'
        port: 4100
    metrics_path: '/metrics'
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Scrape the OpenTelemetry Collector's Prometheus exporter.
  # The otel collector (deploy/otel/otel-collector.yml) listens on :8888
  # and re-exports all OTLP-received metrics as Prometheus text format.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    scrape_interval: 15s
