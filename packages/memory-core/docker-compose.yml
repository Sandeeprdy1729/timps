# ── TIMPS MemoryServer — Horizontal Scale Stack ──
# Start:       docker compose up -d
# Scale out:   docker compose up -d --scale memory=3
# Stop:        docker compose down
# Wipe data:   docker compose down -v
#
# Security: All secrets (POSTGRES_PASSWORD, REDIS_PASSWORD, GRAFANA_ADMIN_*)
# use Docker Compose variable substitution with safe defaults.
# Override via .env file or shell:
#   echo "POSTGRES_PASSWORD=$(openssl rand -base64 18)" > .env
#   docker compose up -d

version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Postgres Primary (writes; source for streaming replicas) ──
  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timps_memory
      POSTGRES_USER: timps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timps_secret}
      # Role used by postgres-replica-1/2 for pg_basebackup + WAL streaming
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-timps_repl_secret}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timps -d timps_memory"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # ── Postgres Replica 1 (read-only streaming replica of postgres-primary) ──
  postgres-replica-1:
    image: postgres:16-alpine
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    environment:
      # First boot: pg_basebackup from primary as the replication role,
      # then hot standby streaming WAL from the primary.
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-timps_repl_secret}
      POSTGRES_REPLICA_SLOT: replica_1_slot
    volumes:
      - pg-replica1-data:/var/lib/postgresql/data
      - ./deploy/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    healthcheck:
      # Wait for the replica to actually be in recovery (i.e. caught up and
      # streaming), not just for postgres to accept pings during bootstrap.
      test: ["CMD-SHELL", "pg_isready -U timps -d timps_memory && psql -U timps -d timps_memory -tAc \"SELECT pg_is_in_recovery()\" | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      postgres-primary:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # ── Postgres Replica 2 (read-only streaming replica of postgres-primary) ──
  postgres-replica-2:
    image: postgres:16-alpine
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    environment:
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-timps_repl_secret}
      POSTGRES_REPLICA_SLOT: replica_2_slot
    volumes:
      - pg-replica2-data:/var/lib/postgresql/data
      - ./deploy/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timps -d timps_memory && psql -U timps -d timps_memory -tAc \"SELECT pg_is_in_recovery()\" | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      postgres-primary:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # ── PgBouncer (connection pooling) ──
  pgbouncer:
    image: bitnamilegacy/pgbouncer:latest
    environment:
      PGBOUNCER_DATABASE: timps_memory
      PGBOUNCER_PORT: 6432
      POSTGRESQL_HOST: postgres-primary
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: timps
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-timps_secret}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 50
    depends_on:
      postgres-primary:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # ── Redis (cache + pub/sub) ──
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-timps_secret}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-timps_secret}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-timps_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # ── Qdrant (vector search) ──
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    logging: *default-logging
    restart: unless-stopped

  # ── MemoryServer instances (horizontally scalable) ──
  # All env vars below are read by src/server/start.ts:
  #   POSTGRES_*  → PostgresBackend (primary + replicas)
  #   REDIS_URL   → CacheManager + EventBus
  #   QDRANT_URL  → QdrantBackend
  #   TIMPS_*     → TelemetryManager
  memory:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4100:4100"
      - "4101:4101"
    environment:
      NODE_ENV: production
      MEMORY_PROJECT_PATH: /data
      MEMORY_PORT: 4100
      MEMORY_GRPC_PORT: 4101
      # Telemetry: local mode (self-hosted Prometheus + Grafana)
      TIMPS_TELEMETRY_LEVEL: local
      TIMPS_TELEMETRY_OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
      # API key auth: enabled by default. First key auto-generated on startup.
      # To use a specific master secret: TIMPS_API_KEY_AUTH=<your-secret>
      TIMPS_API_KEY_AUTH: "${TIMPS_API_KEY_AUTH:-true}"
      # Postgres: NOT wired — MemoryEngine's semantic store is synchronous but
      # PostgresBackend reads are async, so the engine throws "not iterable".
      # Run the memory service on the shared /data volume (FileBackend) instead.
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-timps_secret}@redis:6379
      # Qdrant (used by the async recall/embedding paths only)
      QDRANT_URL: http://qdrant:6333
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      prometheus:
        condition: service_started
    volumes:
      - memory-data:/data
    logging: *default-logging
    restart: unless-stopped

  # ── Prometheus (metrics scraper) ──
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    logging: *default-logging
    restart: unless-stopped

  # ── Grafana (dashboards) ──
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/timps.yml:ro
      - ./deploy/grafana/dashboard-memory-health.json:/var/lib/grafana/dashboards/timps-memory-health.json:ro
      - ./deploy/grafana/dashboard-performance.json:/var/lib/grafana/dashboards/timps-performance.json:ro
      - ./deploy/grafana/dashboard-agent-activity.json:/var/lib/grafana/dashboards/timps-agent-activity.json:ro
      - ./deploy/grafana/dashboard-system.json:/var/lib/grafana/dashboards/timps-system.json:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "${GF_AUTH_ANONYMOUS_ENABLED:-false}"
      GF_AUTH_ANONYMOUS_ORG_NAME: "TIMPS"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    logging: *default-logging
    restart: unless-stopped

  # ── OpenTelemetry Collector (traces bridge) ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
      - "8888:8888"   # metrics
    volumes:
      - ./deploy/otel/otel-collector.yml:/etc/otel-collector.yml:ro
    command:
      - '--config=/etc/otel-collector.yml'
    logging: *default-logging
    restart: unless-stopped

volumes:
  pg-primary-data:
  pg-replica1-data:
  pg-replica2-data:
  redis-data:
  qdrant-data:
  memory-data:
  prometheus-data:
  grafana-data:
